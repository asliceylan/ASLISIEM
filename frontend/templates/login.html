<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASLISIEM — Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #050B18;
    --bg-2: #0A1830;
    --card-bg: rgba(16, 32, 64, 0.55);
    --card-border: rgba(120, 150, 210, 0.25);
    --hairline: rgba(140, 168, 218, 0.28);
    --accent: #3B6FE0;
    --accent-2: #5B8CF5;
    --white: #FFFFFF;
    --muted: #93A6C7;
    --dim: #6E80A0;
    --error: #E5484D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', sans-serif; }

  .stage {
    position: relative;
    min-height: 100vh;
    width: 100%;
    background:
      radial-gradient(90% 70% at 78% 30%, #12274F 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 60%, #030712 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  canvas#field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .ant-watermark {
    position: absolute;
    left: -40px;
    top: 6%;
    width: 620px;
    height: 620px;
    opacity: 0.16;
    z-index: 1;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7vw;
    gap: 40px;
    flex-wrap: wrap;
  }

  .brand {
    max-width: 560px;
    padding-left: 22px;
    border-left: 3px solid var(--accent-2);
  }

  .brand .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 6vw, 68px);
    letter-spacing: 0.02em;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 0 40px rgba(91, 140, 245, 0.35);
  }

  .brand .subline {
    margin-top: 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(15px, 1.6vw, 20px);
    letter-spacing: 0.3em;
    color: var(--accent-2);
  }

  .card {
    position: relative;
    z-index: 3;
    width: 400px;
    max-width: 92vw;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 34px 34px 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }

  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.12em;
    color: var(--white);
    text-align: center;
  }
  .card-title-rule {
    width: 46px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    margin: 12px auto 26px;
    border-radius: 2px;
  }

  .error-msg {
    background: rgba(229, 72, 77, 0.12);
    border: 1px solid rgba(229, 72, 77, 0.35);
    color: var(--error);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 9px;
    margin-bottom: 20px;
    text-align: center;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .input-wrap { position: relative; }
  .input-wrap svg.icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--muted); fill: none; pointer-events: none;
  }
  .input-wrap input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1px solid var(--hairline);
    border-radius: 9px;
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    color: var(--white);
    background: rgba(8, 18, 38, 0.55);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .input-wrap input::placeholder { color: #5B6C8C; }
  .input-wrap input:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(91, 140, 245, 0.18);
  }
  .toggle-eye {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; cursor: pointer; stroke: var(--muted); fill: none; background: none; border: none; padding: 0;
  }

  .btn-signin {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--white);
    background: linear-gradient(90deg, #1E3E8A 0%, var(--accent) 55%, var(--accent-2) 100%);
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(59, 111, 224, 0.35);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-signin:hover { filter: brightness(1.08); }
  .btn-signin:active { transform: translateY(1px); }

  @media (max-width: 900px) {
    .content { flex-direction: column; padding: 40px 6vw; justify-content: center; }
    .brand { text-align: left; }
    .ant-watermark { width: 380px; height: 380px; top: 2%; opacity: 0.12; }
  }
</style>
</head>
<body>

<div class="stage">
  <canvas id="field"></canvas>

  <svg class="ant-watermark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="52" rx="18" ry="20" fill="#5B8CF5"/>
    <ellipse cx="100" cy="95" rx="24" ry="26" fill="#5B8CF5"/>
    <ellipse cx="100" cy="150" rx="32" ry="38" fill="#5B8CF5"/>
    <circle cx="93" cy="46" r="3" fill="#050B18"/>
    <line x1="86" y1="82" x2="35" y2="60" stroke="#5B8CF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="82" y1="95" x2="22" y2="95" stroke="#5B8CF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="86" y1="108" x2="35" y2="132" stroke="#5B8CF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="114" y1="82" x2="165" y2="60" stroke="#5B8CF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="118" y1="95" x2="178" y2="95" stroke="#5B8CF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="114" y1="108" x2="165" y2="132" stroke="#5B8CF5" stroke-width="6" stroke-linecap="round"/>
    <path d="M92 34 Q78 12 60 8" stroke="#5B8CF5" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M108 34 Q122 12 140 8" stroke="#5B8CF5" stroke-width="5" stroke-linecap="round" fill="none"/>
  </svg>

  <div class="content">
    <div class="brand">
      <div class="wordmark">ASLISIEM</div>
      <div class="subline">SECURITY OPERATION CENTER</div>
    </div>

    <div class="card">
      <div class="card-title">GİRİŞ</div>
      <div class="card-title-rule"></div>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login_page') }}">
        <div class="field">
          <label for="username">Kullanıcı Adı</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" stroke-width="1.8"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="password">Şifre</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11V8a4 4 0 118 0v3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-eye" onclick="togglePw()">
              <svg id="eyeIcon" viewBox="0 0 24 24" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-signin">GİRİŞ YAP</button>
      </form>
    </div>
  </div>
</div>

<script>
function togglePw() {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}

// Background field: tiny ant-shaped particles drifting in a wave band near
// the bottom, plus a sparse starfield above -- replaces plain dots with ants.
(function () {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  let w, h, ants = [], stars = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function init() {
    ants = [];
    const count = Math.floor((w * h) / 9000);
    for (let i = 0; i < count; i++) {
      const bandBias = Math.random();
      ants.push({
        x: Math.random() * w,
        y: h * (0.55 + bandBias * 0.5) + Math.random() * 40 - 20,
        vx: (Math.random() - 0.5) * 0.12,
        vy: -0.02 - Math.random() * 0.05,
        size: 0.9 + Math.random() * 1.6,
        alpha: 0.15 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
      });
    }
    stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random() * w, y: Math.random() * h * 0.6, r: Math.random() * 1.1, a: Math.random() * 0.5 });
    }
  }

  function drawAnt(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.globalAlpha = a.alpha;
    ctx.fillStyle = '#BFD3FF';
    ctx.beginPath(); ctx.ellipse(0, -a.size * 1.4, a.size * 0.4, a.size * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, a.size * 0.5, a.size * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, a.size * 1.5, a.size * 0.65, a.size * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function step(t) {
    ctx.clearRect(0, 0, w, h);

    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#9DB6E8';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const a of ants) {
      a.x += a.vx + Math.sin(t * 0.0006 + a.phase) * 0.08;
      a.y += a.vy;
      if (a.y < h * 0.45) { a.y = h; a.x = Math.random() * w; }
      if (a.x < -10) a.x = w + 10;
      if (a.x > w + 10) a.x = -10;
      drawAnt(a);
    }

    requestAnimationFrame(step);
  }

  resize();
  init();
  requestAnimationFrame(step);
  window.addEventListener('resize', () => { resize(); init(); });
})();
</script>

</body>
</html>
